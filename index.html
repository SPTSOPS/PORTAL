<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SPTS Operation Portal</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b4a5a" />
  <style>
    :root {
      --teal: #0b4a5a;
      --teal-dark: #073642;
      --bg: #f4f6f9;
      --pill-bg: #eef2f6;
      --text: #0f172a;
      --border: #1e293b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 14px 14px 28px 14px;
    }
    .app-container {
      width: 100%;
      max-width: 460px;
    }

    /* User Profile Header (Compact as per Image 2) */
    .user-header {
      text-align: center;
      margin-bottom: 14px;
    }
    .user-name {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      color: #000;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .badge-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pill {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1.5px solid var(--border);
      background: var(--pill-bg);
      color: #0f172a;
    }
    .pill.active {
      background: var(--teal);
      color: #fff;
      border-color: var(--teal);
    }

    /* Compact Menu Cards */
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .menu-card {
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.12);
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .menu-card:active {
      transform: scale(0.985);
      background: var(--teal-dark);
    }
    .menu-icon {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .menu-icon svg {
      width: 30px;
      height: 30px;
      stroke: #fff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .menu-text h3 {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 2px;
    }
    .menu-text p {
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.88);
      line-height: 1.25;
    }

    /* Birthday Section */
    .birthday-section {
      margin-top: 18px;
    }
    .birthday-title {
      text-align: center;
      font-size: 0.95rem;
      font-weight: 800;
      color: #1677c5;
      letter-spacing: 0.4px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .birthday-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      font-size: 0.78rem;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }
    .birthday-table thead {
      background: #1677c5;
      color: #fff;
    }
    .birthday-table th,
    .birthday-table td {
      padding: 8px 10px;
      text-align: left;
    }
    .birthday-table th:last-child,
    .birthday-table td:last-child {
      text-align: center;
    }
    .birthday-table tbody tr {
      border-bottom: 1px solid #e2e8f0;
      font-weight: 700;
    }

    /* Fullscreen Module Overlay with Camera Permission */
    #moduleViewer {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #f4f6f9;
      z-index: 999;
    }
  </style>
</head>
<body>

<div class="app-container" id="homeView">
  <!-- Header -->
  <div class="user-header">
    <div class="user-name" id="userName">NOFIJUIDI BIN JUMRI</div>
    <div class="badge-row">
      <span class="pill">SPTS</span>
      <span class="pill active" id="userIdBadge">ID : T5218</span>
      <span class="pill" id="userGroupBadge">Group : OFFICE</span>
    </div>
  </div>

  <!-- Compact Menu Cards -->
  <div class="menu-list">
    <button class="menu-card" onclick="openModule('modules/equipment-checklist.html')">
      <div class="menu-icon">
        <svg viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="9" y1="13" x2="15" y2="13"></line>
          <line x1="9" y1="17" x2="13" y2="17"></line>
        </svg>
      </div>
      <div class="menu-text">
        <h3>Equipment Checklist</h3>
        <p>Inspect and Update Issues</p>
      </div>
    </button>

    <button class="menu-card" onclick="openModule('modules/manpower-booking.html')">
      <div class="menu-icon">
        <svg viewBox="0 0 24 24">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </div>
      <div class="menu-text">
        <h3>Manpower Booking</h3>
        <p>View Latest Booking</p>
      </div>
    </button>

    <button class="menu-card" onclick="openModule('modules/walkie-talkie.html')">
      <div class="menu-icon">
        <svg viewBox="0 0 24 24">
          <rect x="7" y="7" width="10" height="14" rx="2"></rect>
          <line x1="12" y1="2" x2="12" y2="7"></line>
          <line x1="10" y1="11" x2="14" y2="11"></line>
          <line x1="10" y1="15" x2="14" y2="15"></line>
        </svg>
      </div>
      <div class="menu-text">
        <h3>Walkie Talkie Declaration</h3>
        <p>Submit daily walkie-talkie usage</p>
      </div>
    </button>

    <button class="menu-card" onclick="openModule('modules/serial-scanner.html')">
      <div class="menu-icon">
        <svg viewBox="0 0 24 24">
          <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
          <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
          <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
          <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
          <line x1="7" y1="12" x2="17" y2="12"></line>
          <line x1="9" y1="9" x2="9" y2="15"></line>
          <line x1="15" y1="9" x2="15" y2="15"></line>
        </svg>
      </div>
      <div class="menu-text">
        <h3>Serial & Barcode Scanner</h3>
        <p>Scan equipment & battery labels</p>
      </div>
    </button>

    <button class="menu-card" onclick="openModule('modules/historical-record.html')">
      <div class="menu-icon">
        <svg viewBox="0 0 24 24">
          <rect x="4" y="3" width="16" height="18" rx="2"></rect>
          <line x1="8" y1="8" x2="16" y2="8"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
          <line x1="8" y1="16" x2="12" y2="16"></line>
        </svg>
      </div>
      <div class="menu-text">
        <h3>Historical Record</h3>
        <p>Search & View Past Inspection Logs</p>
      </div>
    </button>

    <button class="menu-card" onclick="openModule('modules/incoming-operation-activities.html')">
      <div class="menu-icon">
        <svg viewBox="0 0 24 24">
          <rect x="1" y="3" width="15" height="13"></rect>
          <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
          <circle cx="5.5" cy="18.5" r="2.5"></circle>
          <circle cx="18.5" cy="18.5" r="2.5"></circle>
        </svg>
      </div>
      <div class="menu-text">
        <h3>Incoming Operation Activities</h3>
        <p>View vessels, transfers & housekeeping</p>
      </div>
    </button>

    <button class="menu-card" onclick="openModule('modules/contacts-directory.html')">
      <div class="menu-icon">
        <svg viewBox="0 0 24 24">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
      </div>
      <div class="menu-text">
        <h3>Contacts Directory</h3>
        <p>Department extensions & emergency hotlines</p>
      </div>
    </button>
  </div>

  <!-- Birthday Table -->
  <div class="birthday-section">
    <div class="birthday-title">NOVEMBER'S BIRTHDAY</div>
    <table class="birthday-table">
      <thead>
        <tr>
          <th>DOB</th>
          <th>NAME</th>
          <th>SHIFT GROUP</th>
        </tr>
      </thead>
      <tbody id="birthdayBody">
        <tr>
          <td>04</td>
          <td>IRZANNI BIN YUSOF</td>
          <td>A</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Iframe with Camera Delegation for Scanner Module -->
<iframe id="moduleViewer" allow="camera"></iframe>

<script>
  const moduleViewer = document.getElementById('moduleViewer');

  function openModule(path) {
    moduleViewer.src = path;
    moduleViewer.style.display = 'block';
  }

  // Listen for "Back" button inside modules/serial-scanner.html
  window.addEventListener('message', (event) => {
    if (event.data && event.data.action === 'closeModule') {
      moduleViewer.style.display = 'none';
      moduleViewer.src = 'about:blank';
    }
  });
</script>
</body>
</html>
