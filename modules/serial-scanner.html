<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Battery Scanner | SPTS Operation Portal</title>
  <script src="https://unpkg.com/@zxing/library@0.20.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --header-bg: #08506b;
      --primary: #08506b;
      --blue-btn: #0078D4;
      --green-btn: #16a34a;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: none;
      -moz-text-size-adjust: none;
      text-size-adjust: none;
    }
    body {
      background: var(--bg);
      color: var(--text);
    }

    .top-bar {
      background: var(--header-bg);
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .back-btn {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .top-bar h1 {
      font-size: 17px;
      font-weight: 800;
    }

    .main-wrap {
      max-width: 412px;
      margin: 0 auto;
      padding: 12px 14px;
    }

    /* Compact Camera Viewfinder */
    .camera-box {
      position: relative;
      width: 100%;
      height: 210px;
      background: #0f172a;
      border: 2.5px solid var(--header-bg);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Dynamic Guide Frame: Wide Rectangle (Barcode) <-> Square (QR) */
    .guide-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 82%;
      height: 82px;
      border: 3px solid #22c55e;
      border-radius: 8px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.42);
      pointer-events: none;
      transition: width 0.25s ease, height 0.25s ease, border-color 0.25s ease;
    }
    .guide-frame.qr-mode {
      width: 145px;
      height: 145px;
      border-color: #00ff88;
      box-shadow: 0 0 14px rgba(0, 255, 136, 0.6), 0 0 0 9999px rgba(0, 0, 0, 0.48);
    }
    .guide-badge {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: #4ade80;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    /* Lens Switcher & Hardware Zoom */
    .cam-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
      background: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      align-items: center;
    }
    .cam-controls select {
      width: 100%;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f8fafc;
      color: var(--text);
    }
    .zoom-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
    }
    .zoom-wrap input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }

    /* Status Pill */
    .status-pill {
      margin-top: 8px;
      padding: 9px 12px;
      background: #e2e8f0;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      word-break: break-word;
    }
    .status-pill.success { background: #dcfce7; color: #166534; }
    .status-pill.error { background: #fee2e2; color: #b91c1c; }

    /* Action Buttons */
    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .btn {
      padding: 11px 8px;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-teal { background: var(--primary); }
    .btn-blue { background: var(--blue-btn); }
    .btn-copy {
      background: var(--green-btn);
      width: 100%;
      padding: 12px;
      font-size: 15px;
      margin-top: 10px;
    }

    /* Serial Output Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: #1e293b;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 11px 12px;
      font-size: 16px;
      font-weight: 700;
      border: 1.5px solid #94a3b8;
      border-radius: 8px;
      color: #0f172a;
      background: #f8fafc;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="back-btn" onclick="goBack()">← Back</button>
  <h1>Battery Scanner</h1>
</div>

<div class="main-wrap">
  <!-- Compact Live Camera Viewfinder -->
  <div class="camera-box">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <div class="guide-frame" id="guideFrame">
      <div class="guide-badge" id="guideBadge">SERIAL BARCODE MODE</div>
    </div>
  </div>

  <!-- Lens Switcher & Hardware Zoom -->
  <div class="cam-controls">
    <select id="cameraSelect" title="Switch Rear / Macro Lens">
      <option value="">Default Rear Camera</option>
    </select>
    <div class="zoom-wrap">
      <span id="zoomLabel">1.5x</span>
      <input type="range" id="zoomSlider" min="1" max="4" step="0.1" value="1.5" />
    </div>
  </div>

  <div class="status-pill" id="statusPill">Starting camera...</div>

  <div class="action-row">
    <button class="btn btn-teal" id="restartBtn" type="button">🔄 Reset View</button>
    <button class="btn btn-blue" id="snapBtn" type="button">📸 Snap & Read</button>
  </div>

  <!-- Serial Number Output & Copy Card -->
  <div class="card">
    <div class="field">
      <label for="serialInput">Battery Serial No</label>
      <input type="text" id="serialInput" placeholder="e.g. SN:500004004A05" />
    </div>
    <button class="btn btn-copy" id="copyBtn" type="button">📋 Copy Serial Number</button>
  </div>
</div>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const guideFrame = document.getElementById('guideFrame');
  const guideBadge = document.getElementById('guideBadge');
  const cameraSelect = document.getElementById('cameraSelect');
  const zoomSlider = document.getElementById('zoomSlider');
  const zoomLabel = document.getElementById('zoomLabel');
  const statusPill = document.getElementById('statusPill');
  const restartBtn = document.getElementById('restartBtn');
  const snapBtn = document.getElementById('snapBtn');
  const serialInput = document.getElementById('serialInput');
  const copyBtn = document.getElementById('copyBtn');

  let activeStream = null;
  let videoTrack = null;
  let isFrozen = false;
  let qrLoopTimer = null;
  const offscreenCanvas = document.createElement('canvas');
  const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

  function goBack() {
    window.location.href = '../index.html';
  }

  function setStatus(text, type = '') {
    statusPill.textContent = text;
    statusPill.className = 'status-pill ' + type;
  }

  // Extract ONLY the first serial number and format uniformly as "SN:XXXXXXXXXXXX"
  function extractFirstSerial(rawText) {
    if (!rawText) return '';
    const clean = rawText.trim().toUpperCase();
    let serialCode = '';

    // 1. Match "STICKER SERIAL : 500001CC96831" before "BODY SERIAL"
    const stickerMatch = clean.match(/STICKER\s*SERIAL\s*[:\-]?\s*([A-Z0-9]{8,16})/);
    if (stickerMatch && stickerMatch[1]) {
      serialCode = stickerMatch[1].replace(/BODY.*$/, '');
    }

    // 2. Match "SN:500004004A05" or "SN 500004004A05"
    if (!serialCode) {
      const snMatch = clean.match(/\bSN\s*[:\-]?\s*([A-Z0-9]{8,16})/);
      if (snMatch && snMatch[1]) {
        serialCode = snMatch[1];
      }
    }

    // 3. Fallback: grab the first Motorola serial starting with 5000 (12-13 chars)
    if (!serialCode) {
      const first5000 = clean.match(/5000[A-Z0-9]{8,10}/);
      if (first5000) {
        serialCode = first5000[0];
      }
    }

    // 4. Generic single token fallback
    if (!serialCode) {
      const genericToken = clean.match(/[A-Z0-9]{8,16}/);
      serialCode = genericToken ? genericToken[0] : clean.replace(/^SN[:\s]*/i, '');
    }

    return serialCode ? `SN:${serialCode}` : '';
  }

  // 1. Populate Available Rear Lenses
  async function loadCameraDevices() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
    const devices = await navigator.mediaDevices.enumerateDevices();
    const videoInputs = devices.filter(d => d.kind === 'videoinput');
    if (videoInputs.length <= 1) return;

    const currentId = cameraSelect.value;
    cameraSelect.innerHTML = '';
    videoInputs.forEach((dev, idx) => {
      const opt = document.createElement('option');
      opt.value = dev.deviceId;
      opt.textContent = dev.label || `Camera Lens ${idx + 1}`;
      cameraSelect.appendChild(opt);
    });

    if (currentId) {
      cameraSelect.value = currentId;
    } else {
      const backCameras = videoInputs.filter(d => /back|rear|environment/i.test(d.label));
      if (backCameras.length > 0) cameraSelect.value = backCameras[0].deviceId;
    }
  }

  cameraSelect.addEventListener('change', () => {
    startLiveCamera(cameraSelect.value);
  });

  // 2. Hardware Zoom Slider + CSS Fallback Zoom
  zoomSlider.addEventListener('input', async () => {
    const z = parseFloat(zoomSlider.value);
    zoomLabel.textContent = z.toFixed(1) + 'x';
    if (videoTrack) {
      const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
      if (caps.zoom) {
        const clamped = Math.min(Math.max(z, caps.zoom.min), caps.zoom.max);
        await videoTrack.applyConstraints({ advanced: [{ zoom: clamped }] });
        return;
      }
    }
    video.style.transform = `scale(${z})`;
  });

  // 3. Start Live Camera
  async function startLiveCamera(selectedDeviceId = '') {
    stopStream();
    isFrozen = false;
    setGuideMode('barcode');
    canvas.style.display = 'none';
    video.style.display = 'block';
    guideFrame.style.display = 'block';
    snapBtn.textContent = '📸 Snap & Read';
    snapBtn.disabled = false;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('Live camera blocked (requires HTTPS).', 'error');
      return;
    }

    const baseConstraints = selectedDeviceId
      ? { deviceId: { exact: selectedDeviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }
      : { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } };

    try {
      activeStream = await navigator.mediaDevices.getUserMedia({ video: baseConstraints, audio: false });
      video.srcObject = activeStream;
      videoTrack = activeStream.getVideoTracks()[0];
      await video.play();

      await loadCameraDevices();
      if (videoTrack.getSettings().deviceId) {
        cameraSelect.value = videoTrack.getSettings().deviceId;
      }

      const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
      const adv = [];
      if (caps.focusMode && caps.focusMode.includes('continuous')) {
        adv.push({ focusMode: 'continuous' });
      }
      if (caps.zoom) {
        zoomSlider.min = caps.zoom.min;
        zoomSlider.max = Math.min(caps.zoom.max, 5);
        const initZoom = Math.min(Math.max(1.5, caps.zoom.min), caps.zoom.max);
        zoomSlider.value = initZoom;
        zoomLabel.textContent = initZoom.toFixed(1) + 'x';
        adv.push({ zoom: initZoom });
      } else {
        video.style.transform = `scale(${zoomSlider.value})`;
      }
      if (adv.length) await videoTrack.applyConstraints({ advanced: adv });

      setStatus('Live — Align SN barcode inside box or aim at QR code');
      startLiveQrWatcher();
    } catch (err) {
      setStatus('Camera error (' + err.name + '). Try switching lens.', 'error');
    }
  }

  function stopStream() {
    if (qrLoopTimer) clearInterval(qrLoopTimer);
    if (activeStream) {
      activeStream.getTracks().forEach(t => t.stop());
      activeStream = null;
      videoTrack = null;
    }
  }

  // 4. Switch Border Dynamically: Wide Rectangle (Barcode) <-> Square (QR)
  function setGuideMode(mode) {
    if (mode === 'qr') {
      guideFrame.classList.add('qr-mode');
      guideBadge.textContent = 'QR CODE DETECTED';
    } else {
      guideFrame.classList.remove('qr-mode');
      guideBadge.textContent = 'SERIAL BARCODE MODE';
    }
  }

  // 5. Continuous Lightweight QR Watcher
  function startLiveQrWatcher() {
    if (qrLoopTimer) clearInterval(qrLoopTimer);
    qrLoopTimer = setInterval(() => {
      if (isFrozen || !video.videoWidth || !window.jsQR) return;

      const scale = 0.5;
      offscreenCanvas.width = video.videoWidth * scale;
      offscreenCanvas.height = video.videoHeight * scale;
      offscreenCtx.drawImage(video, 0, 0, offscreenCanvas.width, offscreenCanvas.height);

      const imgData = offscreenCtx.getImageData(0, 0, offscreenCanvas.width, offscreenCanvas.height);
      const qr = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'dontInvert' });

      if (qr && qr.data) {
        setGuideMode('qr');
        const fullQrText = qr.data.trim();
        const firstSerial = extractFirstSerial(fullQrText);
        serialInput.value = firstSerial;
        setStatus(`QR Captured: ${fullQrText}`, 'success');
      } else {
        setGuideMode('barcode');
      }
    }, 450);
  }

  // 6. Snap & Read First Serial Number Only
  snapBtn.addEventListener('click', async () => {
    if (isFrozen) {
      await startLiveCamera(cameraSelect.value);
      return;
    }
    if (!video.videoWidth) return;

    snapBtn.disabled = true;
    setStatus('Snapped! Reading serial number...');

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

    video.style.display = 'none';
    guideFrame.style.display = 'none';
    canvas.style.display = 'block';
    isFrozen = true;

    await extractSerialOnly(canvas.toDataURL('image/png'));
    snapBtn.textContent = '📷 Resume Live Camera';
    snapBtn.disabled = false;
  });

  restartBtn.addEventListener('click', () => {
    serialInput.value = '';
    startLiveCamera(cameraSelect.value);
  });

  // 7. Decode Snapshot -> First Serial Number with "SN:" in Input, Full Details in Green Banner
  async function extractSerialOnly(dataUrl) {
    const img = new Image();
    img.src = dataUrl;
    await img.decode();

    // Check QR first
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = img.width;
    tempCanvas.height = img.height;
    const tCtx = tempCanvas.getContext('2d');
    tCtx.drawImage(img, 0, 0);
    const idata = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
    const qr = window.jsQR ? jsQR(idata.data, idata.width, idata.height) : null;
    if (qr && qr.data) {
      const fullQrText = qr.data.trim();
      const firstSerial = extractFirstSerial(fullQrText);
      serialInput.value = firstSerial;
      setStatus(`QR Captured: ${fullQrText}`, 'success');
      return;
    }

    // Try 1D Barcode via ZXing
    let rawDetected = '';
    let firstSerial = '';
    try {
      const reader = new ZXing.BrowserMultiFormatReader();
      const res = await reader.decodeFromImageElement(img);
      if (res && res.text) {
        rawDetected = res.text.trim();
        firstSerial = extractFirstSerial(rawDetected);
      }
    } catch (e) {}

    // Fallback to Tesseract OCR for printed SN line
    if (!firstSerial) {
      try {
        const { data: { text } } = await Tesseract.recognize(dataUrl, 'eng');
        rawDetected = text.trim();
        firstSerial = extractFirstSerial(rawDetected);
      } catch (err) {
        setStatus('OCR error: ' + err.message, 'error');
        return;
      }
    }

    if (firstSerial) {
      serialInput.value = firstSerial;
      setStatus(`Serial Detected: ${firstSerial}`, 'success');
    } else {
      setStatus('Serial not detected — align SN barcode or QR code and retry.', 'error');
    }
  }

  // 8. Copy Serial Number to Clipboard
  copyBtn.addEventListener('click', async () => {
    const val = serialInput.value.trim();
    if (!val) {
      setStatus('No serial number to copy yet.', 'error');
      return;
    }

    try {
      await navigator.clipboard.writeText(val);
    } catch (e) {
      serialInput.select();
      document.execCommand('copy');
    }

    const originalText = copyBtn.textContent;
    copyBtn.textContent = '✅ Copied: ' + val;
    setStatus(`Copied "${val}" to clipboard`, 'success');
    setTimeout(() => {
      copyBtn.textContent = originalText;
    }, 2000);
  });

  startLiveCamera();
</script>
</body>
</html>
