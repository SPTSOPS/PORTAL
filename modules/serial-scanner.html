<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Battery Scanner | SPTS Operation Portal</title>
  <!-- ZXing for 1D barcodes, jsQR for fast live QR detection, Tesseract for OCR fallback -->
  <script src="https://unpkg.com/@zxing/library@0.20.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --header-bg: #0b4a5a;
      --primary: #0b4a5a;
      --blue-btn: #1677c5;
      --green-btn: #219653;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); }

    .top-bar {
      background: var(--header-bg);
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .back-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }
    .top-bar h1 { margin: 0; font-size: 1.15rem; font-weight: 700; }

    .main-wrap { max-width: 520px; margin: 0 auto; padding: 12px; }

    /* Compact Camera Viewfinder (210px height) */
    .camera-box {
      position: relative;
      width: 100%;
      height: 210px;
      background: #0f172a;
      border: 3px solid var(--header-bg);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Dynamic Guide Frame: Default Wide Rectangle for 1D Barcodes */
    .guide-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 82%;
      height: 82px;
      border: 3px solid #22c55e;
      border-radius: 8px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.42);
      pointer-events: none;
      transition: width 0.25s ease, height 0.25s ease, border-color 0.25s ease;
    }
    /* Morphs into a Square when QR Code is detected */
    .guide-frame.qr-mode {
      width: 145px;
      height: 145px;
      border-color: #00ff88;
      box-shadow: 0 0 14px rgba(0, 255, 136, 0.6), 0 0 0 9999px rgba(0, 0, 0, 0.48);
    }
    .guide-badge {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.78);
      color: #4ade80;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    /* Lens & Zoom Control Bar */
    .cam-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
      background: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      align-items: center;
    }
    .cam-controls select {
      width: 100%;
      padding: 6px 8px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f8fafc;
      color: var(--text);
    }
    .zoom-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary);
    }
    .zoom-wrap input[type="range"] { width: 100%; accent-color: var(--primary); }

    /* Status Pill */
    .status-pill {
      margin-top: 8px;
      padding: 9px 12px;
      background: #e2e8f0;
      border-radius: 8px;
      text-align: center;
      font-size: 0.84rem;
      font-weight: 600;
      color: #1e293b;
    }
    .status-pill.success { background: #dcfce7; color: #166534; }
    .status-pill.error { background: #fee2e2; color: #b91c1c; }

    /* Action Buttons */
    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .btn {
      padding: 11px 8px;
      border: none;
      border-radius: 9px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-teal { background: var(--primary); }
    .btn-blue { background: var(--blue-btn); }
    .btn-green { background: var(--green-btn); width: 100%; font-size: 0.95rem; padding: 12px; }
    .btn-full { grid-column: span 2; }

    /* Form Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 10px;
    }
    .field { margin-bottom: 10px; }
    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 800;
      color: #1e293b;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      border: 1.5px solid #94a3b8;
      border-radius: 8px;
      color: #0f172a;
    }

    .history-title {
      margin: 14px 0 8px 0;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
    }
    .empty-msg { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 8px 0; }
    .history-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.84rem;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="back-btn" onclick="goBack()">← Back</button>
  <h1>Battery Scanner</h1>
</div>

<div class="main-wrap">
  <!-- Compact Live Camera Viewfinder -->
  <div class="camera-box">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <div class="guide-frame" id="guideFrame">
      <div class="guide-badge" id="guideBadge">BARCODE / SERIAL MODE</div>
    </div>
  </div>

  <!-- Lens Switcher (for Macro Lens) & Hardware Zoom -->
  <div class="cam-controls">
    <select id="cameraSelect" title="Switch Rear / Macro Lens">
      <option value="">Default Rear Camera</option>
    </select>
    <div class="zoom-wrap">
      <span id="zoomLabel">1.0x</span>
      <input type="range" id="zoomSlider" min="1" max="4" step="0.1" value="1.5" />
    </div>
  </div>

  <div class="status-pill" id="statusPill">Starting camera...</div>

  <div class="action-row">
    <button class="btn btn-teal" id="restartBtn" type="button">🔄 Reset View</button>
    <button class="btn btn-blue" id="snapBtn" type="button">📸 Snap & Read</button>
    <label for="nativeCamInput" class="btn btn-teal btn-full" style="background:#334155; font-size:0.8rem; padding:8px;">
      📁 Use Native Phone Camera / Macro Photo
    </label>
    <input type="file" id="nativeCamInput" accept="image/*" capture="environment" style="display:none;" />
  </div>

  <div class="card">
    <div class="field">
      <label>Battery Serial / Model No.</label>
      <input type="text" id="serialInput" placeholder="e.g. NNTN8570B or 500002151395" />
    </div>
    <div class="field">
      <label>Remarks / Condition (Optional)</label>
      <input type="text" id="remarksInput" placeholder="e.g. Good / Spare / WBT06..." />
    </div>
    <button class="btn btn-green" id="saveBtn" type="button">Save Battery Record</button>
  </div>

  <div class="history-title">Recent Battery Scans</div>
  <div id="historyContainer">
    <div class="empty-msg">No battery scans recorded yet.</div>
  </div>
</div>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const guideFrame = document.getElementById('guideFrame');
  const guideBadge = document.getElementById('guideBadge');
  const cameraSelect = document.getElementById('cameraSelect');
  const zoomSlider = document.getElementById('zoomSlider');
  const zoomLabel = document.getElementById('zoomLabel');
  const statusPill = document.getElementById('statusPill');
  const restartBtn = document.getElementById('restartBtn');
  const snapBtn = document.getElementById('snapBtn');
  const nativeCamInput = document.getElementById('nativeCamInput');
  const serialInput = document.getElementById('serialInput');
  const remarksInput = document.getElementById('remarksInput');
  const saveBtn = document.getElementById('saveBtn');
  const historyContainer = document.getElementById('historyContainer');

  let activeStream = null;
  let videoTrack = null;
  let isFrozen = false;
  let qrLoopTimer = null;
  const offscreenCanvas = document.createElement('canvas');
  const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

  function goBack() {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ action: 'closeModule' }, '*');
    } else {
      window.location.href = '../index.html';
    }
  }

  function setStatus(text, type = '') {
    statusPill.textContent = text;
    statusPill.className = 'status-pill ' + type;
  }

  // 1. Populate Available Rear Lenses (Main, Wide, Macro)
  async function loadCameraDevices() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
    const devices = await navigator.mediaDevices.enumerateDevices();
    const videoInputs = devices.filter(d => d.kind === 'videoinput');
    if (videoInputs.length <= 1) return;

    const currentId = cameraSelect.value;
    cameraSelect.innerHTML = '';
    videoInputs.forEach((dev, idx) => {
      const opt = document.createElement('option');
      opt.value = dev.deviceId;
      // Label back lenses clearly so operator can test which physical lens is Macro
      opt.textContent = dev.label || `Camera Lens ${idx + 1}`;
      cameraSelect.appendChild(opt);
    });

    // Prefer last back camera if none selected yet (Android often exposes Macro/Aux lenses last)
    if (currentId) {
      cameraSelect.value = currentId;
    } else {
      const backCameras = videoInputs.filter(d => /back|rear|environment/i.test(d.label));
      if (backCameras.length > 0) cameraSelect.value = backCameras[0].deviceId;
    }
  }

  cameraSelect.addEventListener('change', () => {
    startLiveCamera(cameraSelect.value);
  });

  // 2. Hardware Zoom Slider + CSS Fallback Zoom
  zoomSlider.addEventListener('input', async () => {
    const z = parseFloat(zoomSlider.value);
    zoomLabel.textContent = z.toFixed(1) + 'x';
    if (videoTrack) {
      const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
      if (caps.zoom) {
        const clamped = Math.min(Math.max(z, caps.zoom.min), caps.zoom.max);
        await videoTrack.applyConstraints({ advanced: [{ zoom: clamped }] });
        return;
      }
    }
    // Smooth visual zoom fallback if hardware zoom isn't exposed on that lens
    video.style.transform = `scale(${z})`;
  });

  // 3. Start Live Camera with Macro/Close-Focus Hints
  async function startLiveCamera(selectedDeviceId = '') {
    stopStream();
    isFrozen = false;
    setGuideMode('barcode');
    canvas.style.display = 'none';
    video.style.display = 'block';
    guideFrame.style.display = 'block';
    snapBtn.textContent = '📸 Snap & Read';
    snapBtn.disabled = false;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('Live camera blocked (requires HTTPS). Use Native Camera below.', 'error');
      return;
    }

    const baseConstraints = selectedDeviceId
      ? { deviceId: { exact: selectedDeviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }
      : { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } };

    try {
      activeStream = await navigator.mediaDevices.getUserMedia({ video: baseConstraints, audio: false });
      video.srcObject = activeStream;
      videoTrack = activeStream.getVideoTracks()[0];
      await video.play();

      await loadCameraDevices();
      if (videoTrack.getSettings().deviceId) {
        cameraSelect.value = videoTrack.getSettings().deviceId;
      }

      // Apply close-range focus & initial 1.5x zoom if supported by lens
      const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
      const adv = [];
      if (caps.focusMode && caps.focusMode.includes('continuous')) {
        adv.push({ focusMode: 'continuous' });
      }
      if (caps.zoom) {
        zoomSlider.min = caps.zoom.min;
        zoomSlider.max = Math.min(caps.zoom.max, 5);
        const initZoom = Math.min(Math.max(1.5, caps.zoom.min), caps.zoom.max);
        zoomSlider.value = initZoom;
        zoomLabel.textContent = initZoom.toFixed(1) + 'x';
        adv.push({ zoom: initZoom });
      } else {
        video.style.transform = `scale(${zoomSlider.value})`;
      }
      if (adv.length) await videoTrack.applyConstraints({ advanced: adv });

      setStatus('Live — Align barcode inside green box or aim at QR code');
      startLiveQrWatcher();
    } catch (err) {
      setStatus('Camera error (' + err.name + '). Try switching lens or Native Camera.', 'error');
    }
  }

  function stopStream() {
    if (qrLoopTimer) clearInterval(qrLoopTimer);
    if (activeStream) {
      activeStream.getTracks().forEach(t => t.stop());
      activeStream = null;
      videoTrack = null;
    }
  }

  // 4. Switch Border Dynamically: Wide Rectangle (Barcode) <-> Square (QR)
  function setGuideMode(mode) {
    if (mode === 'qr') {
      guideFrame.classList.add('qr-mode');
      guideBadge.textContent = 'QR CODE DETECTED';
    } else {
      guideFrame.classList.remove('qr-mode');
      guideBadge.textContent = 'BARCODE / SERIAL MODE';
    }
  }

  // 5. Continuous Lightweight QR Watcher (Auto-morphs border to Square & reads QR)
  function startLiveQrWatcher() {
    if (qrLoopTimer) clearInterval(qrLoopTimer);
    qrLoopTimer = setInterval(() => {
      if (isFrozen || !video.videoWidth || !window.jsQR) return;

      // Downscale frame for fast 60ms QR scanning without lagging phone
      const scale = 0.5;
      offscreenCanvas.width = video.videoWidth * scale;
      offscreenCanvas.height = video.videoHeight * scale;
      offscreenCtx.drawImage(video, 0, 0, offscreenCanvas.width, offscreenCanvas.height);

      const imgData = offscreenCtx.getImageData(0, 0, offscreenCanvas.width, offscreenCanvas.height);
      const qr = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'dontInvert' });

      if (qr && qr.data) {
        // Dynamically morph guide box to square and populate serial number!
        setGuideMode('qr');
        const cleanedQr = qr.data.trim();
        serialInput.value = cleanedQr;
        setStatus(`QR Code Captured: ${cleanedQr}`, 'success');
      } else {
        setGuideMode('barcode');
      }
    }, 450);
  }

  // 6. Manual Snap & Read (for 1D Barcodes & Printed Serial Numbers)
  snapBtn.addEventListener('click', async () => {
    if (isFrozen) {
      await startLiveCamera(cameraSelect.value);
      return;
    }
    if (!video.videoWidth) return;

    snapBtn.disabled = true;
    setStatus('Snapped! Decoding barcode & label text...');

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

    video.style.display = 'none';
    guideFrame.style.display = 'none';
    canvas.style.display = 'block';
    isFrozen = true;

    await extractFromSnapshot(canvas.toDataURL('image/png'));
    snapBtn.textContent = '📷 Resume Live Camera';
    snapBtn.disabled = false;
  });

  restartBtn.addEventListener('click', () => {
    serialInput.value = '';
    startLiveCamera(cameraSelect.value);
  });

  nativeCamInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = async () => {
        canvas.width = img.width;
        canvas.height = img.height;
        canvas.getContext('2d').drawImage(img, 0, 0);
        video.style.display = 'none';
        guideFrame.style.display = 'none';
        canvas.style.display = 'block';
        isFrozen = true;
        snapBtn.textContent = '📷 Resume Live Camera';
        await extractFromSnapshot(ev.target.result);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  // 7. Decode Snapshot (QR -> 1D Barcode -> OCR)
  async function extractFromSnapshot(dataUrl) {
    const img = new Image();
    img.src = dataUrl;
    await img.decode();

    // Check QR first on high-res snapshot
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = img.width;
    tempCanvas.height = img.height;
    const tCtx = tempCanvas.getContext('2d');
    tCtx.drawImage(img, 0, 0);
    const idata = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
    const qr = window.jsQR ? jsQR(idata.data, idata.width, idata.height) : null;
    if (qr && qr.data) {
      serialInput.value = qr.data.trim();
      setStatus(`QR Serial Extracted: ${serialInput.value}`, 'success');
      return;
    }

    // Try 1D Barcode via ZXing
    let modelFound = '';
    let serialFound = '';
    try {
      const reader = new ZXing.BrowserMultiFormatReader();
      const res = await reader.decodeFromImageElement(img);
      if (res && res.text) {
        const parsed = parseMotorolaLabel(res.text);
        if (parsed.model) modelFound = parsed.model;
        if (parsed.serial) serialFound = parsed.serial;
      }
    } catch (e) {}

    // Fallback to Tesseract OCR for printed text
    try {
      const { data: { text } } = await Tesseract.recognize(dataUrl, 'eng');
      const parsed = parseMotorolaLabel(text);
      if (!modelFound && parsed.model) modelFound = parsed.model;
      if (!serialFound && parsed.serial) serialFound = parsed.serial;
    } catch (err) {
      setStatus('OCR error: ' + err.message, 'error');
      return;
    }

    if (modelFound && serialFound) {
      serialInput.value = `${modelFound} | SN:${serialFound}`;
      setStatus(`Detected: ${serialInput.value}`, 'success');
    } else if (modelFound || serialFound) {
      serialInput.value = modelFound || serialFound;
      setStatus(`Detected: ${serialInput.value}`, 'success');
    } else {
      setStatus('Unreadable label — try aiming at the QR code or zoom closer.', 'error');
    }
  }

  function parseMotorolaLabel(raw) {
    const clean = raw.toUpperCase();
    const modelMatch = clean.match(/\b(NNTN|PMNN)[A-Z0-9]{4,8}\b/);
    const serialMatch = clean.match(/SN[:\s]*([A-Z0-9]{8,16})/);
    return {
      model: modelMatch ? modelMatch[0] : null,
      serial: serialMatch ? serialMatch[1] : null
    };
  }

  // 8. Save Record
  saveBtn.addEventListener('click', () => {
    const val = serialInput.value.trim();
    const remarks = remarksInput.value.trim();
    if (!val) {
      setStatus('Scan or enter a Serial / Model number first.', 'error');
      return;
    }
    const records = JSON.parse(localStorage.getItem('spts_battery_scans') || '[]');
    records.unshift({
      code: val,
      remarks: remarks || 'Good',
      user: sessionStorage.getItem('spts_user') || 'Operator',
      time: new Date().toLocaleString('en-MY', { hour12: false })
    });
    localStorage.setItem('spts_battery_scans', JSON.stringify(records.slice(0, 25)));
    serialInput.value = '';
    remarksInput.value = '';
    renderHistory();
    setStatus('Battery record saved!', 'success');
    startLiveCamera(cameraSelect.value);
  });

  function renderHistory() {
    const records = JSON.parse(localStorage.getItem('spts_battery_scans') || '[]');
    if (!records.length) {
      historyContainer.innerHTML = '<div class="empty-msg">No battery scans recorded yet.</div>';
      return;
    }
    historyContainer.innerHTML = records.map(r => `
      <div class="history-item">
        <div><strong>${r.code}</strong><br><span style="color:#64748b; font-size:0.78rem;">${r.remarks}</span></div>
        <div style="text-align:right; color:#64748b; font-size:0.75rem;">${r.time}</div>
      </div>
    `).join('');
  }

  renderHistory();
  startLiveCamera();
</script>
</body>
</html>
