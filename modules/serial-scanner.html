<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Battery Scanner | SPTS Operation Portal</title>
  <script src="https://unpkg.com/@zxing/library@0.20.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --header-bg: #0b4a5a;
      --primary: #0b4a5a;
      --blue-btn: #1677c5;
      --green-btn: #219653;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }
    /* Top Header matching your portal */
    .top-bar {
      background: var(--header-bg);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .back-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .top-bar h1 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
    }
    .main-wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 14px;
    }

    /* Large Continuous Camera Viewfinder */
    .camera-box {
      position: relative;
      width: 100%;
      height: 360px; /* Explicit height prevents collapsing */
      background: #0f172a;
      border: 3px solid var(--header-bg);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* Dimmed outer mask + crisp scan border */
    .guide-frame {
      position: absolute;
      top: 22%;
      left: 8%;
      width: 84%;
      height: 56%;
      border: 2.5px solid #00ff88;
      border-radius: 10px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    .guide-label {
      position: absolute;
      top: -26px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #00ff88;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    /* Status Pill */
    .status-pill {
      margin-top: 12px;
      padding: 11px 14px;
      background: #e2e8f0;
      border-radius: 10px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      color: #1e293b;
    }
    .status-pill.error {
      background: #fee2e2;
      color: #b91c1c;
    }

    /* Action Buttons */
    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .btn {
      padding: 13px 10px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-teal { background: var(--primary); }
    .btn-blue { background: var(--blue-btn); }
    .btn-green { background: var(--green-btn); width: 100%; font-size: 1rem; padding: 14px; }
    .btn-full { grid-column: span 2; }

    /* Form Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-top: 14px;
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 800;
      color: #1e293b;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      border: 1.5px solid #94a3b8;
      border-radius: 10px;
      color: #0f172a;
    }
    .field input::placeholder { color: #94a3b8; font-weight: 500; }

    /* Recent Scans */
    .history-title {
      margin: 18px 0 10px 0;
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
    }
    .empty-msg {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 12px 0;
    }
    .history-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="back-btn" onclick="goBack()">← Back</button>
  <h1>Battery Scanner</h1>
</div>

<div class="main-wrap">
  <!-- Large Live Camera Viewfinder -->
  <div class="camera-box" id="cameraBox">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <div class="guide-frame" id="guideFrame">
      <div class="guide-label">ALIGN BATTERY LABEL HERE</div>
    </div>
  </div>

  <div class="status-pill" id="statusPill">Starting rear camera...</div>

  <!-- Snap & Restart Controls -->
  <div class="action-row">
    <button class="btn btn-teal" id="restartBtn" type="button">🔄 Restart Camera</button>
    <button class="btn btn-blue" id="snapBtn" type="button">📸 Snap & Read Label</button>
    <label for="nativeCamInput" class="btn btn-teal btn-full" style="background:#334155; font-size:0.85rem; padding:10px;">
      📁 Or Use Phone Native Camera / Upload
    </label>
    <input type="file" id="nativeCamInput" accept="image/*" capture="environment" style="display:none;" />
  </div>

  <!-- Input Card -->
  <div class="card">
    <div class="field">
      <label>Battery Serial / Model No.</label>
      <input type="text" id="serialInput" placeholder="e.g. NNTN8570B or 500002151395" />
    </div>
    <div class="field">
      <label>Remarks / Condition (Optional)</label>
      <input type="text" id="remarksInput" placeholder="e.g. Good / Spare / Assigned to..." />
    </div>
    <button class="btn btn-green" id="saveBtn" type="button">Save Battery Record</button>
  </div>

  <div class="history-title">Recent Battery Scans</div>
  <div id="historyContainer">
    <div class="empty-msg">No battery scans recorded yet.</div>
  </div>
</div>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const guideFrame = document.getElementById('guideFrame');
  const statusPill = document.getElementById('statusPill');
  const restartBtn = document.getElementById('restartBtn');
  const snapBtn = document.getElementById('snapBtn');
  const nativeCamInput = document.getElementById('nativeCamInput');
  const serialInput = document.getElementById('serialInput');
  const remarksInput = document.getElementById('remarksInput');
  const saveBtn = document.getElementById('saveBtn');
  const historyContainer = document.getElementById('historyContainer');

  let activeStream = null;
  let isFrozen = false;

  function goBack() {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ action: 'closeModule' }, '*');
    } else {
      window.location.href = '../index.html';
    }
  }

  function setStatus(text, isError = false) {
    statusPill.textContent = text;
    statusPill.className = isError ? 'status-pill error' : 'status-pill';
  }

  // 1. Keep Live Camera Running Continuously
  async function startLiveCamera() {
    stopStream();
    isFrozen = false;
    canvas.style.display = 'none';
    video.style.display = 'block';
    guideFrame.style.display = 'block';
    snapBtn.textContent = '📸 Snap & Read Label';
    snapBtn.disabled = false;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('Live camera blocked (use HTTPS or native camera button below).', true);
      return;
    }

    const attempts = [
      { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false },
      { video: { facingMode: 'environment' }, audio: false },
      { video: true, audio: false }
    ];

    for (const constraints of attempts) {
      try {
        activeStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = activeStream;
        video.setAttribute('playsinline', true);
        await video.play();
        setStatus('Camera live — Align label inside green border & tap Snap');
        return;
      } catch (err) {
        console.warn('Camera attempt failed:', err.name);
      }
    }

    setStatus('Camera permission denied or busy. Use Native Camera button below.', true);
  }

  function stopStream() {
    if (activeStream) {
      activeStream.getTracks().forEach(track => track.stop());
      activeStream = null;
    }
  }

  // 2. Snap Photo from Live Viewfinder & Extract
  snapBtn.addEventListener('click', async () => {
    if (isFrozen) {
      // Resume live camera if already snapped
      await startLiveCamera();
      return;
    }

    if (!video.videoWidth || !video.videoHeight) {
      setStatus('Camera not ready yet. Tap Restart Camera or use Native Camera.', true);
      return;
    }

    snapBtn.disabled = true;
    setStatus('Snapped! Reading barcode & label text...');

    // Draw full frame onto canvas and freeze view
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    video.style.display = 'none';
    guideFrame.style.display = 'none';
    canvas.style.display = 'block';
    isFrozen = true;

    const fullImageUrl = canvas.toDataURL('image/png');
    await processCapturedImage(fullImageUrl);

    snapBtn.textContent = '📷 Resume Live Camera';
    snapBtn.disabled = false;
  });

  // 3. Restart Camera Button
  restartBtn.addEventListener('click', () => {
    serialInput.value = '';
    startLiveCamera();
  });

  // 4. Native Camera / File Upload Fallback
  nativeCamInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    setStatus('Processing captured photo...');
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = async () => {
        canvas.width = img.width;
        canvas.height = img.height;
        canvas.getContext('2d').drawImage(img, 0, 0);
        video.style.display = 'none';
        guideFrame.style.display = 'none';
        canvas.style.display = 'block';
        isFrozen = true;
        snapBtn.textContent = '📷 Resume Live Camera';

        await processCapturedImage(ev.target.result);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  // 5. Extract Serial & Model Number (Barcode + OCR)
  async function processCapturedImage(imageDataUrl) {
    let modelFound = '';
    let serialFound = '';

    // Try Barcode first
    try {
      const reader = new ZXing.BrowserMultiFormatReader();
      const img = new Image();
      img.src = imageDataUrl;
      await img.decode();
      const res = await reader.decodeFromImageElement(img);
      if (res && res.text) {
        const parsed = extractMotorolaFields(res.text);
        if (parsed.model) modelFound = parsed.model;
        if (parsed.serial) serialFound = parsed.serial;
      }
    } catch (e) {
      // Proceed to OCR
    }

    // Run OCR for full label lines
    try {
      const { data: { text } } = await Tesseract.recognize(imageDataUrl, 'eng');
      const parsed = extractMotorolaFields(text);
      if (!modelFound && parsed.model) modelFound = parsed.model;
      if (!serialFound && parsed.serial) serialFound = parsed.serial;
    } catch (err) {
      setStatus('OCR error: ' + err.message, true);
      return;
    }

    if (modelFound && serialFound) {
      serialInput.value = `${modelFound} | SN:${serialFound}`;
      setStatus(`Detected Model (${modelFound}) & Serial (${serialFound})`);
    } else if (modelFound || serialFound) {
      serialInput.value = modelFound || serialFound;
      setStatus(`Detected: ${serialInput.value}`);
    } else {
      setStatus('Label captured, but text was blurry. Resume camera & snap closer.', true);
    }
  }

  function extractMotorolaFields(rawText) {
    const clean = rawText.toUpperCase();
    const modelMatch = clean.match(/\b(NNTN|PMNN)[A-Z0-9]{4,8}\b/);
    const serialMatch = clean.match(/SN[:\s]*([A-Z0-9]{8,16})/);
    return {
      model: modelMatch ? modelMatch[0] : null,
      serial: serialMatch ? serialMatch[1] : null
    };
  }

  // 6. Save Record & Render History
  saveBtn.addEventListener('click', () => {
    const val = serialInput.value.trim();
    const remarks = remarksInput.value.trim();
    if (!val) {
      setStatus('Please snap a battery label or enter Serial/Model No. first.', true);
      return;
    }

    const records = JSON.parse(localStorage.getItem('spts_battery_scans') || '[]');
    records.unshift({
      code: val,
      remarks: remarks || 'Good',
      user: sessionStorage.getItem('spts_user') || 'Operator',
      time: new Date().toLocaleString('en-MY', { hour12: false })
    });
    localStorage.setItem('spts_battery_scans', JSON.stringify(records.slice(0, 25)));

    serialInput.value = '';
    remarksInput.value = '';
    renderHistory();
    setStatus('Battery record saved!');
    startLiveCamera();
  });

  function renderHistory() {
    const records = JSON.parse(localStorage.getItem('spts_battery_scans') || '[]');
    if (!records.length) {
      historyContainer.innerHTML = '<div class="empty-msg">No battery scans recorded yet.</div>';
      return;
    }
    historyContainer.innerHTML = records.map(r => `
      <div class="history-item">
        <div>
          <strong>${r.code}</strong><br>
          <span style="color:#64748b; font-size:0.8rem;">${r.remarks}</span>
        </div>
        <div style="text-align:right; color:#64748b; font-size:0.78rem;">
          ${r.time}
        </div>
      </div>
    `).join('');
  }

  renderHistory();
  startLiveCamera();
</script>
</body>
</html>
